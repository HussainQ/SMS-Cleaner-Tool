name: GitHub Pre-Release (Non-Production Local Device Testing)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published, created, edited, prereleased]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Pre-release tag name (defaults to v<versionName> from app/build.gradle.kts)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish-prerelease:
    name: Build & Publish Pre-Release APK (Non-Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for Android SDK 36 & Robolectric)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache Robolectric Android SDK 36 Runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-16-robolectric-13921718-i7

      - name: Pre-fetch Robolectric SDK 36 Jar (Prevent Maven Central Rate Limit)
        run: |
          M2_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          mkdir -p "$M2_DIR"
          BASE_URL="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          for ext in pom pom.sha512 jar jar.sha512; do
            FILE="android-all-instrumented-16-robolectric-13921718-i7.${ext}"
            if [ ! -s "$M2_DIR/$FILE" ]; then
              curl -fSL --retry 5 --retry-delay 3 --retry-all-errors "$BASE_URL/$FILE" -o "$M2_DIR/$FILE"
            fi
          done

      - name: Restore Cached Persistent CI Debug Keystore
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: debug.keystore
          key: cleansms-ci-debug-keystore-v2

      - name: Configure Persistent Signing Keystore
        id: signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "build_mode=release" >> "$GITHUB_OUTPUT"
            echo "save_cache=false" >> "$GITHUB_OUTPUT"
            echo "Signed with persistent RELEASE_KEYSTORE_BASE64 secret."
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "build_mode=debug" >> "$GITHUB_OUTPUT"
            echo "save_cache=false" >> "$GITHUB_OUTPUT"
            echo "Signed with persistent DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore ]; then
            echo "build_mode=debug" >> "$GITHUB_OUTPUT"
            echo "save_cache=false" >> "$GITHUB_OUTPUT"
            echo "Reusing cached persistent CI debug.keystore (for permanent key continuity, set DEBUG_KEYSTORE_BASE64 secret)."
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CleanSMS Local Testing,O=CleanSMS,C=US"
            echo "build_mode=debug" >> "$GITHUB_OUTPUT"
            echo "save_cache=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Generated initial CI debug.keystore (cached for future runs; set DEBUG_KEYSTORE_BASE64 repository secret for permanent cross-run & cross-machine continuity)."
          fi

      - name: Save Generated CI Debug Keystore to Cache
        if: steps.signing.outputs.save_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: debug.keystore
          key: cleansms-ci-debug-keystore-v2

      - name: Run Gradle and Robolectric Verification Suite
        run: gradle :app:testDebugUnitTest

      - name: Assemble Pre-Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.build_mode }}" = "release" ]; then
            gradle :app:assembleRelease
          else
            gradle :app:assembleDebug
          fi

      - name: Prepare Pre-Release Artifacts, Checksums & Signing Certificate Fingerprint
        id: artifacts
        run: |
          VERSION_NAME=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          DEFAULT_TAG="v${VERSION_NAME:-1.7.1-pre.1}"

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$DEFAULT_TAG"
          fi

          if [ "${{ steps.signing.outputs.build_mode }}" = "release" ] && [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          else
            APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          fi

          APK_DEST="CleanSMS-${TAG}-nonprod-local-test.apk"
          cp "$APK_SOURCE" "$APK_DEST"
          sha256sum "$APK_DEST" > "${APK_DEST}.sha256"

          CERT_SHA256=$(keytool -printcert -jarfile "$APK_DEST" | grep -m1 'SHA256:' | awk '{print $2}' || true)
          echo "apk_file=${APK_DEST}" >> "$GITHUB_OUTPUT"
          echo "sha_file=${APK_DEST}.sha256" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "APK Signing Certificate SHA-256: ${CERT_SHA256}"

      - name: Publish GitHub Pre-Release (Non-Production / Local Testing Only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.tag }}
          name: "CleanSMS ${{ steps.artifacts.outputs.tag }} (Pre-Release • Non-Production Local Device Testing)"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
          make_latest: "false"
          files: |
            ${{ steps.artifacts.outputs.apk_file }}
            ${{ steps.artifacts.outputs.sha_file }}
