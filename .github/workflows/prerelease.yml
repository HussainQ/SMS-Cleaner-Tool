name: GitHub Pre-Release (Non-Production Local Device Testing)

on:
  push:
    tags:
      - 'v*-pre.*'
      - 'v*-beta.*'
      - 'v*-rc.*'
      - 'v*-alpha.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Pre-release tag name (e.g. v1.5.0-pre.1)'
        required: true
        default: 'v1.5.0-pre.1'

permissions:
  contents: write

jobs:
  build-and-publish-prerelease:
    name: Build & Publish Pre-Release APK (Non-Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Unit & Robolectric Verification Suite
        run: gradle :app:testDebugUnitTest

      - name: Assemble Local Testing Pre-Release APK
        run: gradle :app:assembleDebug

      - name: Prepare Pre-Release Artifacts & Checksums
        id: artifacts
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="CleanSMS-${TAG}-nonprod-local-test.apk"
          cp "$APK_SOURCE" "$APK_DEST"
          sha256sum "$APK_DEST" > "${APK_DEST}.sha256"
          echo "apk_file=${APK_DEST}" >> $GITHUB_OUTPUT
          echo "sha_file=${APK_DEST}.sha256" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Pre-Release (Non-Production / Local Testing Only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.tag }}
          name: "CleanSMS ${{ steps.artifacts.outputs.tag }} (Pre-Release • Non-Production Local Device Testing)"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
          make_latest: "false"
          files: |
            ${{ steps.artifacts.outputs.apk_file }}
            ${{ steps.artifacts.outputs.sha_file }}
